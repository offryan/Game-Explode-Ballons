<!DOCTYPE HTML>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Estourando balões</title>
		<link rel="stylesheet" href="estilo.css">
		<script src="jogo.js"></script>
	</head>

	<body class="pagina-jogo" onload="iniciaJogo()">
		<main class="jogo">
			<div class="painel">
				<div class="placar" title="Balões inteiros">
					<img src="imagens/balao_azul_grande.png" alt="Balões inteiros" />
					<span id="baloes_inteiros"></span>
				</div>

				<div class="placar" title="Balões estourados">
					<img src="imagens/balao_azul_grande_estourado.png" alt="Balões estourados" />
					<span id="baloes_estourados"></span>
				</div>

				<div class="cronometro" title="Tempo restante">
					<span id="cronometro"></span>
				</div>
			</div>

			<div id="cenario">
				<div class="resultado" id="resultado">
					<div class="resultado-cartao">
						<h2 id="resultado_titulo"></h2>
						<p id="resultado_texto"></p>
						<a href="" id="jogar_de_novo">Jogar de novo</a>
						<a href="index.html" class="secundario">Mudar nível</a>
					</div>
				</div>
			</div>
		</main>
	</body>
</html>
